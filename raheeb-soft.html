<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرهيب سوفت</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f3f6fa;
    color:#172033;
}

.header{
    background:#1261a0;
    color:white;
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:25px;
    box-shadow:0 3px 15px #0001;
    margin-bottom:20px;
}

button{
    background:#1261a0;
    color:white;
    border:0;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:.9;
}

h2{
    margin-top:0;
}
</style>
</head>

<body>

<div class="header">
    الرهيب سوفت
</div>

<div class="container">

    <div class="card">
        <h2>مرحبًا بك في الرهيب سوفت</h2>
        <p>نظام إدارة المبيعات والمخزون والحسابات.</p>
        <button onclick="alert('الرهيب سوفت يعمل بنجاح')">
            اختبار النظام
        </button>
    </div>

</div>

</body>
</html>
